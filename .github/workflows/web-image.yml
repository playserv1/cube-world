# Publishes the browser client (web/) to the web VM on Vultr (infra/vultr) as an image: builds deploy/web/Dockerfile,
# pushes it to GHCR, and has the VM pull it and serve it. main deploys the prod site, dev the dev site.
#
# One of the two web deploy workflows runs, by the repository variable WEB_DEPLOY_MODE: this one unless it is `files`,
# web-files.yml (rsync, no registry) when it is. Each deploy tells the VM how to serve its environment, so switching
# the variable and deploying again is the whole switch. Setup and the variables and secrets below: infra/vultr/README.md.
#
# Repository: variables WEB_VM_HOST, WEB_DEPLOY_KNOWN_HOSTS, WEB_DEPLOY_MODE; secret WEB_DEPLOY_SSH_KEY.
# Environments web-prod and web-dev: variable WEB_HOST, optional WEB_CONFIG_JS (replaces web/config.js).
name: Web client → VM (image)

# PAUSED: the VM gets no deploys on push; GitHub Pages (pages.yml) and Cloud Run (web-cloudrun.yml) do.
# Run workflow (workflow_dispatch) still deploys by hand. To resume, uncomment `push:` and its two lines.
on:
  # push:
  #   branches: [main, dev]
  #   paths: ['web/**', 'deploy/web/**', '.github/workflows/web-image.yml']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Shared with web-files.yml: one deploy per environment at a time, whichever workflow it comes from.
concurrency:
  group: web-deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.WEB_DEPLOY_MODE != 'files' && (github.ref_name == 'main' || github.ref_name == 'dev')
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'main' && 'web-prod' || 'web-dev' }}
      url: https://${{ vars.WEB_HOST }}
    env:
      SITE: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
    steps:
      - uses: actions/checkout@v4

      - name: Use the environment's config.js
        if: vars.WEB_CONFIG_JS != ''
        env:
          WEB_CONFIG_JS: ${{ vars.WEB_CONFIG_JS }}
        run: printf '%s\n' "$WEB_CONFIG_JS" > web/config.js

      - name: Check config.js
        run: |
          test -s web/config.js || {
            echo "::error::web/config.js is missing: commit it, or set WEB_CONFIG_JS on the ${{ github.ref_name == 'main' && 'web-prod' || 'web-dev' }} environment"
            exit 1
          }

      - name: Name the image
        id: meta
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}-web"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "tags=$image:${GITHUB_SHA::12},$image:$SITE" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .   # the checkout, with the config.js above; deploy/web/Dockerfile.dockerignore trims it to web/
          file: deploy/web/Dockerfile
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy on the VM
        env:
          VM: ${{ vars.WEB_VM_HOST }}
          KNOWN_HOSTS: ${{ vars.WEB_DEPLOY_KNOWN_HOSTS }}
          SSH_KEY: ${{ secrets.WEB_DEPLOY_SSH_KEY }}
          IMAGE: ${{ steps.meta.outputs.image }}@${{ steps.build.outputs.digest }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          # The VM pulls with this job's token (it expires with the job) and keeps no registry credential.
          printf '%s' "$TOKEN" | ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "deploy@$VM" image "$SITE" "$IMAGE" "$GITHUB_ACTOR"

      - name: Check the site
        env:
          HOST: ${{ vars.WEB_HOST }}
        run: |
          curl -fsS --retry 6 --retry-delay 5 --retry-all-errors "https://$HOST/" | grep -q '<title>Cube World</title>'
          curl -fsS "https://$HOST/config.js" | grep -q 'window.CUBEWORLD'
          echo "::notice::https://$HOST serves ${GITHUB_SHA::12} from its image"
