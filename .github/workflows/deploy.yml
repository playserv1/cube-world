# PlayServ auto-deploy (Epic 6, ADR-023): push to a mapped branch and your
# functions and game servers deploy into that branch's environment — no manual
# step, no repo-side mapping file.
#
# Copy this file into YOUR repo at .github/workflows/deploy.yml.
#
# NOTE: point PLAYSERV_HOST at the dev platform. There is NO server-side gate
# keeping this flow off production - PLATFORM_API_KEY is not set on the prod
# monolith (ADR-023 Change log, 2026-08-14), so running dev-first is a choice,
# not a guard rail.
#
# This variant delegates the deploy itself to the PlayServ CLI rather than
# hand-rolling the upload (PSV-2413). Two things a hand-rolled `tar czf` +
# `curl -F source=@...` loop got wrong:
#   - it only archived each function's own directory, so a csproj referencing
#     a shared project outside that directory (`../Shared.Contracts`) shipped
#     an archive that couldn't build (bare `build FAILURE`, no other clue)
#   - it kept a hand-maintained `FUNCTIONS` slug=dir list in this file, which
#     silently drifts from the repo the moment someone adds a function and
#     forgets the line — a no-op, not an error
# `playserv publish` (`DeployBundler`/`FunctionDiscovery` in the CLI) finds
# every function by its `platform.json` and vendors `ProjectReference`d shared
# projects into each bundle, so there's nothing to maintain here and multi-
# project solutions just work — the same command a developer runs locally.
#
# How it works (the "deploy utility", AD-20):
#   1. POST /api/v1/auth/cli                                  — exchange a deploy key for a session
#   2. GET  /api/v1/projects/{id}/branch-env-bindings?branch= — fetch the platform-served mapping
#      · no enabled binding for the pushed branch → NEUTRAL NO-OP (exit 0):
#        100 branches do not imply 100 environments — unmapped is the normal case
#   3. pick the deploy key matching the mapped env (one key per env, CONFLICT-3)
#   4. sort the repo's platform.json manifests: a cloud_function goes to `publish`,
#      a game_server never does (see "Game servers" below)
#   5. GET  /api/v1/cli/download?rid=linux-x64                — fetch the CLI binary (anonymous)
#      `playserv login` + `playserv publish --only <each function> --env <mapped-env> --yes`
#      — the CLI vendors shared projects, uploads, and polls each deployment to a
#      terminal phase; its own exit code (0 = all succeeded) fails or passes the job
#   6. each game server: `playserv image push` (PSV-2715) — see below
#
# Game servers (kind: game_server) run on a platform machine pool, from an image in
# the project's registry. They are NEVER sent to `publish`: that would build them
# onto Cloud Run, and a Cloud Run URL outranks the pool (ExecutorRun.Derive), so
# room launches would quietly stop reaching the pool's machines. Instead, per server,
# by its state in the mapped env (GET /api/v1/functions?kind=game_server):
#   · not there yet (first push) — register it and leave a pool with NO machines:
#       playserv functions declare <slug> --kind game_server --runtime dotnet10
#         --hosting-mode multi-room
#       room configuration: capacity 16, reservation TTL 20 s, lifetime 86400 s,
#         idle timeout 60 s, max rooms 20            (PUT /functions/{id}/room-config)
#       playserv image push --slug <slug> --tag <sha12>
#       pool: desired_size 0, rooms_per_machine 1    (PUT /machine-pools/<slug>)
#     Nothing paid starts. Raise the pool size and correct the room configuration
#     in the admin (Engineering → Game Servers); this workflow never writes them again.
#   · has a pool — `playserv image push --slug <slug> --tag <sha12> --roll`: the pool
#     replaces its machines one for one, and each old machine closes with its rooms
#     and the players in them. Bind a branch you push deliberately, not a busy one.
#   · anything else (a first run stopped half-way, a server on Cloud Run or run by
#     the studio itself, a deleted or disabled slug) fails the job with what to do
#     by hand. Handling those states in the workflow is PSV-2802.
# The image is built on the runner (Docker is preinstalled on ubuntu-latest). A
# server folder with its own Dockerfile is built from its solution folder (the
# nearest folder holding a .sln/.slnx); a C# server without one gets a Dockerfile
# written by the CLI. The image carries no key: a pool machine hands the server its
# own deployment token (PSV-2799).
# `name` in each platform.json is the slug the platform uses — it must be the real
# slug in your project.
#
# Repository variable (Settings → Secrets and variables → Actions → Variables; a URL is not a secret):
#   PLAYSERV_HOST              — platform base URL, e.g. https://dev.platform.playserv.io
#
# Repository secrets:
#   PLAYSERV_SERVER_KEY        — a per-env server key (sk_*) — enough when every mapped
#                                branch targets the same env
#   PLAYSERV_SERVER_KEY_<ENV>  — one per additional env, uppercased, '-' → '_'
#                                (e.g. env "qa-2" → PLAYSERV_SERVER_KEY_QA_2); each extra
#                                secret must also be listed in the step's `env:` block below
#
# The mapping lives in the platform (admin → project settings → Deployment tab) and is
# read over the API — never from a file in this repo. The GitHub API is never proxied
# by the platform; this workflow only talks to PlayServ.

name: Auto-deploy to PlayServ

on:
  push:
    branches: ['**']   # every branch (not tags) — the platform-served mapping decides
    # A push that only changes the browser client or the docs deploys nothing here:
    # the client goes to GitHub Pages (pages.yml) and must not roll the game servers.
    paths-ignore: ['web/**', '.github/workflows/pages.yml', '*.md']

# One deploy at a time per repo: two pushes must never roll a pool at once, and two
# branches bound to the same env would otherwise race on a first registration.
concurrency:
  group: playserv-deploy-${{ github.repository }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest   # curl, jq and Docker (with buildx) are preinstalled
    steps:
      - uses: actions/checkout@v4

      - name: Resolve branch mapping and deploy
        env:
          PLAYSERV_HOST: ${{ vars.PLAYSERV_HOST }}
          PLAYSERV_SERVER_KEY: ${{ secrets.PLAYSERV_SERVER_KEY }}
          # Multi-env repos: expose each env's key so the script can pick by name.
          # PLAYSERV_SERVER_KEY_DEV: ${{ secrets.PLAYSERV_SERVER_KEY_DEV }}
          # PLAYSERV_SERVER_KEY_PROD: ${{ secrets.PLAYSERV_SERVER_KEY_PROD }}
        run: |
          set -euo pipefail
          BRANCH="${GITHUB_REF_NAME}"

          # ── 1. exchange any held key for a session (the mapping read is env-agnostic)
          bootstrap_key="${PLAYSERV_SERVER_KEY:-}"
          if [ -z "$bootstrap_key" ]; then
            first_var=$(env | sed -n 's/^\(PLAYSERV_SERVER_KEY_[A-Z0-9_]*\)=.*/\1/p' | head -1)
            [ -n "$first_var" ] && bootstrap_key="${!first_var}"
          fi
          if [ -z "$bootstrap_key" ]; then
            echo "::error::no PLAYSERV_SERVER_KEY / PLAYSERV_SERVER_KEY_<ENV> secret is configured"
            exit 1
          fi

          # --fail-with-body keeps the platform's problem+json detail on errors
          # (a bare curl -f would swallow it and report only an opaque exit 22).
          exchange() {
            local resp
            # Cloud Run ingress (GFE) rejects a bodyless POST with 411 before it
            # reaches the platform, so send an explicit zero Content-Length.
            if ! resp=$(curl -sS --fail-with-body -X POST "$PLAYSERV_HOST/api/v1/auth/cli" \
                -H "Authorization: Bearer $1" -H "Content-Length: 0"); then
              echo "::error::auth/cli failed: $resp" >&2
              return 1
            fi
            printf '%s' "$resp"
          }
          session=$(exchange "$bootstrap_key")
          token=$(jq -r .access_token <<<"$session")
          project_id=$(jq -r .project_id <<<"$session")
          key_env=$(jq -r .env <<<"$session")

          # ── 2. fetch the platform-served branch→env mapping (AD-20 — never a repo file)
          branch_q=$(jq -rn --arg v "$BRANCH" '$v|@uri')
          mapping=$(curl -sS --fail-with-body \
            "$PLAYSERV_HOST/api/v1/projects/$project_id/branch-env-bindings?branch=$branch_q" \
            -H "Authorization: Bearer $token") \
            || { echo "::error::mapping fetch failed: $mapping"; exit 1; }
          target_env=$(jq -r '[.data[] | select(.enabled)][0].env_name // empty' <<<"$mapping")

          if [ -z "$target_env" ]; then
            echo "branch '$BRANCH' is not mapped to an environment — nothing to deploy"
            exit 0
          fi
          echo "branch '$BRANCH' deploys to environment '$target_env'"

          # ── 3. one deploy key per env (CONFLICT-3): use the key whose env matches
          deploy_key="$bootstrap_key"
          deploy_session="$session"
          if [ "$key_env" != "$target_env" ]; then
            env_var="PLAYSERV_SERVER_KEY_$(tr '[:lower:]-' '[:upper:]_' <<<"$target_env")"
            deploy_key="${!env_var:-}"
            if [ -z "$deploy_key" ]; then
              echo "::error::branch '$BRANCH' maps to env '$target_env' but no $env_var secret is configured (one deploy key per env)"
              exit 1
            fi
            deploy_session=$(exchange "$deploy_key")
            key_env=$(jq -r .env <<<"$deploy_session")
            if [ "$key_env" != "$target_env" ]; then
              echo "::error::secret $env_var holds a '$key_env' key, not a '$target_env' key"
              exit 1
            fi
          fi
          api_token=$(jq -r .access_token <<<"$deploy_session")
          project_slug=$(jq -r .project_slug <<<"$deploy_session")

          # Operator-plane call in the mapped env: the body lands in $RESP, the HTTP
          # status is printed (so a 404 is an answer here, not a curl failure).
          RESP=$(mktemp)
          api() {
            local args=(-sS -o "$RESP" -w '%{http_code}' -X "$1" "$PLAYSERV_HOST$2"
              -H "Authorization: Bearer $api_token"
              -H "X-Project-Slug: $project_slug" -H "X-Env: $target_env")
            if [ $# -ge 3 ]; then args+=(-H "Content-Type: application/json" --data "$3"); fi
            curl "${args[@]}"
          }

          # ── 4. sort the manifests: functions go to `publish`, game servers never do
          functions=()
          servers=()
          while IFS= read -r manifest; do
            dir=$(dirname "$manifest")
            name=$(jq -r '.name // empty' "$manifest")
            [ -n "$name" ] || name=$(basename "$dir")
            kind=$(jq -r '.kind // "cloud_function"' "$manifest")
            if [ "$kind" = game_server ]; then
              servers+=("$name|$dir")
            else
              functions+=("$name")
            fi
          done < <(find . -name platform.json -not -path '*/bin/*' -not -path '*/obj/*' \
                     -not -path './.git/*' | sort)

          # ── 5. hand the functions to the CLI: it vendors shared projects into each
          #      bundle, uploads, and polls
          curl -fsSL "$PLAYSERV_HOST/api/v1/cli/download?rid=linux-x64" -o playserv
          chmod +x playserv
          # The CLI resolves its target host itself, in this order: PLAYSERV_API_URL env
          # var → the logged-in session's stored ApiUrl → the URL baked into the binary at
          # build time (CliConfig.ResolveApiUrl). Without this pin the download always
          # succeeds (it came from $PLAYSERV_HOST) but login/publish could silently target
          # a *different* host — whatever was baked into that binary — the moment
          # PLAYSERV_HOST points somewhere other than the baked default. Pinning it here
          # makes "downloaded from X" and "talks to X" the same host, always.
          export PLAYSERV_API_URL="$PLAYSERV_HOST"
          ./playserv login "$deploy_key"
          # Plain (non --json) output on purpose: `playserv publish`'s own exit
          # code (0 only if every function deployed) already drives this job's
          # pass/fail, and nothing downstream here parses its output — the
          # human-readable plan/summary tables read better in the Actions log
          # than raw JSON would. The PSV-2412 markup crash that used to force
          # --json here (interpolating the unescaped "[N/M]" counter into
          # Spectre markup) is fixed on dev; reach for --json yourself if you
          # add a step that consumes the result programmatically (e.g. posting
          # deployment IDs to Slack).
          if [ ${#functions[@]} -gt 0 ]; then
            only=()
            for slug in "${functions[@]}"; do only+=(--only "$slug"); done
            ./playserv publish "${only[@]}" --env "$target_env" --yes
          else
            echo "no cloud functions in this repo"
          fi

          # ── 6. game servers: first push registers, later pushes roll the pool's image
          tag="${GITHUB_SHA::12}"
          room_config='{"capacity":16,"reservation_ttl_seconds":20,"room_lifetime_seconds":86400,"room_idle_timeout_seconds":60,"max_rooms":20}'
          for entry in "${servers[@]}"; do
            slug=${entry%%|*}
            dir=${entry#*|}

            # A server's own Dockerfile is written against its solution folder
            # (it copies nuget.config and the project from there); without one
            # the CLI writes a Dockerfile for the server folder itself.
            build=(--src "$dir")
            if [ -f "$dir/Dockerfile" ]; then
              context=$dir
              while [ "$context" != . ] && ! compgen -G "$context/*.sln*" >/dev/null; do
                context=$(dirname "$context")
              done
              build=(--src "$context" --dockerfile "$dir/Dockerfile")
            fi

            q=$(jq -rn --arg v "$slug" '$v|@uri')
            code=$(api GET "/api/v1/functions?kind=game_server&q=$q&limit=100")
            if [ "$code" != 200 ]; then
              echo "::error::could not read game server '$slug' in '$target_env' (HTTP $code): $(cat "$RESP")"
              exit 1
            fi
            state=$(jq -r --arg s "$slug" '[.data[] | select(.slug == $s)][0] | if . == null then "absent" elif .executor_run == "platform-pooled" and .status != "deleted" and .status != "disabled" then "pooled" else "\(.status) / \(.executor_run // "unknown")" end' "$RESP")

            case "$state" in
              pooled)
                echo "game server '$slug': rolling its pool to $tag"
                ./playserv image push --slug "$slug" "${build[@]}" --tag "$tag" --roll --env "$target_env"
                ;;
              absent)
                echo "game server '$slug' is new in '$target_env': registering it with a pool of 0 machines"
                ./playserv functions declare "$slug" --kind game_server --runtime dotnet10 \
                  --hosting-mode multi-room --description playserv-autodeploy --env "$target_env"
                code=$(api GET "/api/v1/functions?kind=game_server&q=$q&limit=100")
                fn_id=$(jq -r --arg s "$slug" '[.data[] | select(.slug == $s)][0].id // empty' "$RESP")
                if [ "$code" != 200 ] || [ -z "$fn_id" ]; then
                  echo "::error::'$slug' was declared but could not be read back (HTTP $code)"
                  exit 1
                fi
                code=$(api PUT "/api/v1/functions/$fn_id/room-config" "$room_config")
                if [[ $code != 2?? ]]; then
                  echo "::error::room configuration for '$slug' refused (HTTP $code): $(cat "$RESP")"
                  exit 1
                fi
                ./playserv image push --slug "$slug" "${build[@]}" --tag "$tag" --env "$target_env"
                pool=$(jq -cn --arg v "$tag" '{desired_size: 0, rooms_per_machine: 1, image_version: $v}')
                code=$(api PUT "/api/v1/machine-pools/$slug" "$pool")
                if [[ $code != 2?? ]]; then
                  echo "::error::pool for '$slug' refused (HTTP $code): $(cat "$RESP")"
                  exit 1
                fi
                echo "::notice::game server '$slug' registered in '$target_env' with a pool of 0 machines on $tag — raise its size in the admin (Engineering → Game Servers)"
                ;;
              *)
                echo "::error::game server '$slug' exists in '$target_env' as '$state' (status / executor_run) — this workflow only registers a new server or rolls a pooled one. Finish it by hand in the admin or with the playserv MCP (declare, room configuration, pool), or rename it in platform.json."
                exit 1
                ;;
            esac
          done
