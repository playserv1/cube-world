# Publishes the browser client (web/) to GitHub Pages on every push that touches it.
# Pages must be enabled in the repository settings with source "GitHub Actions"; serve it over
# plain http on a custom domain (Enforce HTTPS off) while the game servers speak ws://, because
# a page on https may not open an insecure WebSocket.
name: Publish web client to GitHub Pages

# Manual until Pages is enabled in the repository settings (source "GitHub Actions" and a custom
# domain served over http); on a push it would only fail while Pages is off.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4
