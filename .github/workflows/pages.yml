# Publishes the browser client (web/) to GitHub Pages on every push that touches it, at
# https://playserv1.github.io/cube-world/. Pages is set to "GitHub Actions" in the repository settings
# and the github-pages environment allows the dev and main branches. The game servers speak wss://,
# so the https page may connect to them.
name: Publish web client to GitHub Pages

on:
  push:
    branches: [dev, main]
    paths: ['web/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4
