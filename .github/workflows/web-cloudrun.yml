# Publishes the browser client (web/) to Cloud Run (infra/gcp): builds deploy/web/Dockerfile, the same image as the
# Vultr VM's image deploy, pushes it to Artifact Registry, and rolls the service to it. Triggered like pages.yml:
# a push to dev or main that changes the client, or Run workflow. Both branches deploy the one service, so the site
# serves whichever branch pushed last, as GitHub Pages does.
#
# Independent of pages.yml: the same push publishes both, and one failing does not stop the other. The VM workflows
# (web-image.yml / web-files.yml) are paused, deploying by hand only.
#
# GitHub signs in to GCP without a key (Workload Identity Federation), and GCP accepts only this repository's dev and
# main branches (deploy_branches in infra/gcp).
#
# Environment cloud-run-prod (deployment branches: dev, main), variables from `terraform output github_variables`:
#   GCP_PROJECT_ID, GCP_REGION, GCP_WORKLOAD_IDENTITY_PROVIDER, GCP_DEPLOY_SERVICE_ACCOUNT,
#   CLOUD_RUN_SERVICE, CLOUD_RUN_IMAGE, CLOUD_RUN_HOST; optional WEB_CONFIG_JS (replaces web/config.js).
# Setup: infra/gcp/README.md.
name: Web client → Cloud Run

on:
  push:
    branches: [dev, main]
    paths: ['web/**', 'deploy/web/**', '.github/workflows/web-cloudrun.yml']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # the OIDC token GCP exchanges for the deploy account's

concurrency:
  group: web-cloudrun
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref_name == 'dev' || github.ref_name == 'main'
    runs-on: ubuntu-latest
    environment:
      name: cloud-run-prod
      url: https://${{ vars.CLOUD_RUN_HOST }}
    env:
      PROJECT: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
      IMAGE: ${{ vars.CLOUD_RUN_IMAGE }}
    steps:
      - uses: actions/checkout@v7

      - name: Use the environment's config.js
        if: vars.WEB_CONFIG_JS != ''
        env:
          WEB_CONFIG_JS: ${{ vars.WEB_CONFIG_JS }}
        run: printf '%s\n' "$WEB_CONFIG_JS" > web/config.js

      - name: Check config.js
        run: |
          test -s web/config.js || {
            echo "::error::web/config.js is missing: commit it, or set WEB_CONFIG_JS on the cloud-run-prod environment"
            exit 1
          }

      - name: Sign in to GCP
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          token_format: access_token

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ vars.GCP_REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .   # the checkout, with the config.js above; deploy/web/Dockerfile.dockerignore trims it to web/
          file: deploy/web/Dockerfile
          push: true
          provenance: false
          tags: ${{ vars.CLOUD_RUN_IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=cloudrun
          cache-to: type=gha,scope=cloudrun,mode=max

      - uses: google-github-actions/setup-gcloud@v3

      - name: Deploy the new revision
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          # Only the image changes; everything else about the service is Terraform's (infra/gcp/main.tf).
          gcloud run services update "$SERVICE" --project "$PROJECT" --region "$REGION" \
            --image "$IMAGE@$DIGEST" --quiet
          # A hand-made rollback pins traffic to an old revision; a deploy moves it back to the newest.
          gcloud run services update-traffic "$SERVICE" --project "$PROJECT" --region "$REGION" --to-latest --quiet

      - name: Check the site
        env:
          HOST: ${{ vars.CLOUD_RUN_HOST }}
        run: |
          url=$(gcloud run services describe "$SERVICE" --project "$PROJECT" --region "$REGION" --format 'value(status.url)')
          curl -fsS --retry 6 --retry-delay 5 --retry-all-errors "$url/" | grep -q '<title>Cube World</title>'
          curl -fsS "$url/config.js" | grep -q 'window.CUBEWORLD'
          # The custom domain answers only once its certificate is issued (up to a day after the CNAME); not a failure.
          if curl -fsS --max-time 10 "https://$HOST/" | grep -q '<title>Cube World</title>'; then
            echo "::notice::https://$HOST and $url serve ${GITHUB_SHA::12}"
          else
            echo "::warning::$url serves ${GITHUB_SHA::12}, but https://$HOST does not answer yet: check its domain mapping (infra/gcp/README.md)"
          fi
