; The packaged Mac game verifies TLS against a cacert.pem bundle only: the engine's Mac certificate manager reads
; neither the Keychain nor the system store, and UAT stages the bundle only when n.VerifyPeer is set
; (CopyBuildToStagingDirectory). Without it the Mac client could reach no wss server: "certificate verify failed"
; (PSV-2986). Windows adds the system store to the bundle, so the setting is the Mac build's alone.
[/Script/Engine.NetworkSettings]
n.VerifyPeer=True
