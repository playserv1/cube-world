; PlayServ SDK settings (UPlayServSettings, Config=Game). The URL must be quoted: an unquoted "//"
; starts an ini comment. The client key is public by design (it can only create a guest player).
; The Unreal servers play in `dev` beside the C# servers, under their own room type `cubeworld-ue`.
; The dedicated server's key (sk_*) goes in Config/DedicatedServerGame.ini, which stays out of git:
; copy Config/DedicatedServerGame.example.ini and fill it in.
[/Script/PlayServRuntime.PlayServSettings]
BaseURL="https://dev.platform.playserv.io"
ClientKey=pk_dev_wXr9E5uecbat9dtXaWZeO4xws8u2eR6X
RoomDefaultSlug=cubeworld-ue

; A server key never goes into a build. Config/DedicatedServerGame.ini holds a developer's key, for the servers run from
; the editor (Scripts/RunServers.ps1); a Server target staged it into its pak like any of its own config files, so a
; Linux image built on that developer's machine carried the key. On the machine pool the server signs in with the
; machine's deployment token instead.
[Staging]
+DisallowedConfigFiles=CubeWorld/Config/DedicatedServerGame.ini
+DisallowedConfigFiles=CubeWorld/Config/DedicatedServerGame.example.ini
